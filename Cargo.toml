[package]
name = "rs-kdl"
description = "Pure-Rust KDL parser and writer focused on fast parse/write workflows"
readme = "README.md"
repository = "https://github.com/codixor/rs-kdl"
keywords = ["kdl", "parser", "writer", "config", "serialization"]
categories = ["parser-implementations", "encoding"]
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
version = "0.1.1"
include = ["src/**", "tests/**", "examples/**", "benches/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-*"]

[lib]
name = "rs_kdl"
path = "src/lib.rs"

[dependencies]
smol_str = { version = "0.3.7", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
rs-json = { version = "0.3.0", default-features = false, features = ["std"], optional = true }
rs-toml = { version = "0.3.1", default-features = false, optional = true }
rs-yaml = { version = "0.4.0", default-features = false, optional = true }

[features]
default = ["std", "json-interop", "toml-interop", "yaml-interop"]
# enables Node::normalize and Document::normalize
std = ["smol_str/std", "thiserror/std"]
json-interop = ["std", "dep:rs-json"]
toml-interop = ["std", "dep:rs-toml"]
yaml-interop = ["std", "dep:rs-yaml"]

# For testing compliance & performance
[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "html_reports", "plotters"] }
official_kdl = { package = "kdl", version = "6.7.1" }

[[bench]]
name = "kdl_core"
harness = false
required-features = ["json-interop", "toml-interop", "yaml-interop"]

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"

[[example]]
name = "json_contract"
required-features = ["json-interop"]

[[example]]
name = "toml_contract"
required-features = ["toml-interop"]

[[example]]
name = "yaml_contract"
required-features = ["yaml-interop"]

[[test]]
name = "compliance"
required-features = ["std"]

[[test]]
name = "dom_normalize"
required-features = ["std"]

[[test]]
name = "json_interop"
required-features = ["json-interop"]

[[test]]
name = "toml_interop"
required-features = ["toml-interop"]

[[test]]
name = "yaml_interop"
required-features = ["yaml-interop"]
